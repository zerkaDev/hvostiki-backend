[project]
name = "hvostiki-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0,<7.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "celery (>=5.6.1,<6.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "pillow-heif (>=1.2.0,<2.0.0)",
    "firebase-admin (>=7.1.0,<8.0.0)",
    "gunicorn (>=23.0,<24.0)"
]

# Инструменты разработки: их ставит только dev-стейдж образа (`poetry install --with dev`),
# в прод они не попадают (`--only main`), поэтому и группа отдельная, а не main.
[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-django = ">=4.8"
django-debug-toolbar = ">=4.4"
flower = ">=2.0.1,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
