# Прод-стек: nginx (HTTP/HTTPS, статика, медиа) → gunicorn + celery + postgres/redis/rabbitmq.
#
# Подготовка сервера:
#   1. Скопировать .env.prod.example → .env и заполнить (DEBUG=0, SECRET_KEY, пароли, домен).
#   2. Положить service account Firebase в secrets/firebase-key.json.
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. Сертификат Let's Encrypt — README, раздел «HTTPS (Let's Encrypt)».
#
# Наружу открыты только 80/443. Postgres, Redis и RabbitMQ доступны лишь внутри сети compose.
services:
  nginx:
    image: nginx:1.27-alpine
    env_file:
      - .env
    # Шаблон конфига рендерится при старте: ${SERVER_NAME} подставляется из окружения.
    volumes:
      - ./nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/conf.d/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
      - ./nginx/conf.d/0-log_format.conf:/etc/nginx/conf.d/0-log_format.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      # Юридические документы (PDF) отдаются как /legal/<имя>.pdf
      - ./legal:/app/legal:ro
      # Страница поддержки: /support/ (Support URL для App Store)
      - ./support:/app/support:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    # Явно по семьям адресов: короткая запись "80:80" в Docker биндится сразу на IPv4 и IPv6,
    # и вместе с "[::]:80:80" даёт конфликт «address already in use».
    ports:
      - "0.0.0.0:80:80"
      - "[::]:80:80"
      - "0.0.0.0:443:443"
      - "[::]:443:443"
    healthcheck:
      # HTTPS + --no-check-certificate: локальная проверка идёт на 127.0.0.1, а сертификат
      # выписан на домен; http-порт теперь отвечает редиректом и для проверки не годится.
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      web:
        condition: service_healthy
    restart: always

  web:
    build:
      context: .
      target: prod
    command: ["web"]
    env_file:
      - .env
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - private_media:/app/private_media
      # Секрет монтируем, а не COPY в образ: ключ не должен попадать в слои.
      - ./secrets/firebase-key.json:/app/firebase-key.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  celery:
    build:
      context: .
      target: prod
    command: ["worker"]
    # HEALTHCHECK образа проверяет порт 8000, которого у воркера нет: healthcheck не нужен.
    healthcheck:
      disable: true
    env_file:
      - .env
    volumes:
      - media:/app/media
      - private_media:/app/private_media
      - ./secrets/firebase-key.json:/app/firebase-key.json:ro
    # Миграции применяет web; воркер только ждёт БД.
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always

  celery-beat:
    build:
      context: .
      target: prod
    command: ["beat"]
    healthcheck:
      disable: true
    env_file:
      - .env
    volumes:
      # Расписание планировщика переживает перезапуск контейнера.
      - celerybeat:/app/celerybeat
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16
    env_file:
      - .env
    # Настройки под небольшой сервер (2-4 ГБ): дефолтные shared_buffers рассчитаны
    # на выделенную машину и забирают память у остальных контейнеров.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: always

  redis:
    image: redis:7
    # appendonly — кеш и рейт-лимиты переживают перезапуск; maxmemory — чтобы кеш
    # не вытеснил остальные контейнеры на маленьком сервере.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: always

  rabbitmq:
    image: rabbitmq:3
    env_file:
      - .env
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      # Порог памяти под маленький сервер: дефолтные 60% на 2 ГБ блокируют публикацию.
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: always

  # Certbot не стартует вместе со стеком: запускается вручную для выпуска/продления.
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm certbot certonly ...
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  pgdata:
  media:
  private_media:
  staticfiles:
  redisdata:
  rabbitmqdata:
  celerybeat:
