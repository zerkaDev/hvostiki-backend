# Формат access-лога с метриками производительности.
# rt  — сколько занял весь запрос (включая приложение)
# urt — сколько занял upstream (gunicorn); если >> rt, тормозит сеть/nginx
# gz  — коэффициент сжатия (пусто, если ответ не сжимался)
# Определение формата должно быть в http-контексте, поэтому файл лежит в conf.d.
log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time gz=$gzip_ratio';
